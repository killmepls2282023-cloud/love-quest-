<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Финал</title>
<link href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@600;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: 
      radial-gradient(circle at 10% 20%, rgba(255, 100, 50, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(255, 50, 150, 0.2) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(120, 80, 200, 0.15) 0%, transparent 60%),
      #0f0c29;
    background-size: 200% 200%;
    animation: gradientMove 15s ease infinite;
    background-attachment: fixed;
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    text-align: center;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
  }

  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border-radius: 28px;
    padding: 45px 25px;
    max-width: 90%;
    width: 380px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    animation: fadeUp 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    position: relative;
    z-index: 10;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Крупный текст */
  .final-text {
    font-family: 'Playpen Sans', cursive;
    font-weight: 700;
    font-size: 38px; /* Огромный размер */
    color: #ff9a9e;
    line-height: 1.3;
    margin-bottom: 25px;
    animation: pulse 2.5s infinite alternate;
  }

  /* Пульсирующее свечение для текста */
  @keyframes pulse {
    from { text-shadow: 0 0 15px rgba(255, 154, 158, 0.4); transform: scale(1); }
    to { text-shadow: 0 0 35px rgba(255, 154, 158, 0.8); transform: scale(1.02); }
  }

  /* Стили для эмодзи с сердечками */
  .hearts {
    font-size: 50px;
    letter-spacing: 10px;
    margin-top: 20px;
    display: block;
    animation: floatHearts 3s infinite ease-in-out;
  }

  @keyframes floatHearts {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }
    /* Плавное появление для абзацев и картинок */
  .fade-in-element {
    opacity: 0;
    animation: slideUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Задержки, чтобы они появлялись по очереди */
  .delay-1 { animation-delay: 0.3s; }
  .delay-2 { animation-delay: 0.6s; }
  .delay-3 { animation-delay: 0.9s; }
  .delay-4 { animation-delay: 1.2s; }

</style>
</head>
<body>

  <div class="card">
    <!-- Твой большой текст -->
    <div class="final-text">
      Заходи дамой.<br>Я жду тебя броха
    </div>
    
    <!-- Сердечки -->
    <div class="hearts">💖💖💖</div>
  </div>

</body>
</html>
